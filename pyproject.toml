[project]
name = "whyslow"
version = "0.1.0"
description = "Tells you why your laptop was slow, in plain words."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
whyslow = "whyslow.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["whyslow", "whyslow.platforms", "whyslow.analyzer"]

[tool.setuptools.package-data]
whyslow = ["data/*.json", "static/*.html"]

[tool.pytest.ini_options]
# Lets `pytest` find the whyslow package even before `pip install -e .`
pythonpath = ["."]
testpaths = ["tests"]
